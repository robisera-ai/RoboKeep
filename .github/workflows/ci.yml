# Integrazione continua: build e test a ogni push/PR sui sorgenti.
name: CI

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', '.github/workflows/ci.yml']
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RoboKeep.sln

      - name: Build (Release)
        run: dotnet build src/RoboKeep.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/RoboKeep.Tests/RoboKeep.Tests.csproj -c Release --no-build
